<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- JG. monogram: serif italic letters overlapping, J in front (outlined in the tile color so both read),
       plus a teal square (the "Joel Green." logo's dot) -->
  <rect width="64" height="64" rx="12" fill="#0b0b0b"/>
  <text x="18" y="45" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="38" fill="#d6a015">G</text>
  <text x="5" y="47" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="40" fill="#d6a015" stroke="#0b0b0b" stroke-width="3" paint-order="stroke">J</text>
  <rect x="52.7" y="41.7" width="6.6" height="6.6" fill="#10c1b2"/>
</svg>
